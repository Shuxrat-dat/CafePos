{% load static i18n %}<!doctype html>
{% get_current_language as LANG %}
<html lang="{{ LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EC">
  <title>{% translate 'Нет связи с кассой' %}</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #F7F3EC; color: #1E1915; padding: 24px;
           font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; text-align: center; }
    main { max-width: 420px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 24px; margin: 18px 0 8px; }
    p { color: #7A6F63; line-height: 1.5; margin: 0 0 20px; }
    button { min-height: 50px; padding: 0 28px; border: 0; border-radius: 12px; background: #7A3F1E; color: #fff;
             font-size: 16px; font-weight: 600; cursor: pointer; }
    button:active { background: #572A13; }
  </style>
</head>
<body>
  <main>
    <img src="{% static 'icons/icon-192.png' %}" alt="">
    <h1>{% translate 'Нет связи с кассой' %}</h1>
    <p>{% translate 'Проверьте интернет или Wi-Fi. Как только связь появится, страница откроется сама.' %}</p>
    <button type="button" onclick="location.reload()">{% translate 'Повторить' %}</button>
  </main>
  <script>
    // Связь вернулась: открываем нужную страницу снова
    window.addEventListener('online', function () { location.reload(); });
    setInterval(function () {
      fetch('/ping/', { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {});
    }, 5000);
  </script>
</body>
</html>
