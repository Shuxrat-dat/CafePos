<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CafePOS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #0f172a; font-family: "Segoe UI", system-ui, sans-serif; }
    .box { max-width: 420px; margin: 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; } p { color: #64748b; margin: 4px 0; }
    a { display: inline-block; margin-top: 20px; padding: 12px 20px; border-radius: 12px; background: #0f172a; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  {# Без шаблонных тегов: страница должна открыться, даже если сломалась база #}
  <div class="box">
    <div data-lang="uz">
      <h1>Serverda xatolik</h1>
      <p>Sahifani qayta yuklang. Muammo takrorlansa, administratorga xabar bering.</p>
      <a href="/">Bosh sahifa</a>
    </div>
    <div data-lang="ru" hidden>
      <h1>Ошибка сервера</h1>
      <p>Обновите страницу. Если ошибка повторяется, сообщите администратору.</p>
      <a href="/">На главную</a>
    </div>
  </div>
  <script>
    // Показываем язык, выбранный на этом устройстве (по умолчанию узбекский), без обращения к базе
    (function () {
      var m = document.cookie.match(/(?:^|; )cafepos_language=(uz|ru)/), lang = m ? m[1] : 'uz';
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-lang]').forEach(function (el) { el.hidden = el.dataset.lang !== lang; });
    })();
  </script>
</body>
</html>
