<div class="fixed inset-0 z-50 bg-slate-900/50 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white rounded-[20px] shadow-xl w-full max-w-md p-6 space-y-5 max-h-[90vh] overflow-y-auto">
    <div>
      <h2 class="text-[22px] font-bold tracking-tight">Перенести заказ №{{ order.id }}</h2>
      <p class="text-slate-500 mt-0.5">Сейчас: {{ order.table }}. Выберите свободный стол.</p>
    </div>

    {% for hall in halls %}
      <div>
        <div class="font-semibold text-slate-700 mb-2">{{ hall.name }}</div>
        <div class="grid grid-cols-3 gap-2.5">
          {% for table in hall.tables %}
            <form method="post" action="{% url 'move_order' order.id table.id %}">
              {% csrf_token %}
              <button class="w-full min-h-[56px] rounded-xl bg-white border border-slate-200 hover:bg-emerald-50 hover:border-emerald-300 font-bold text-lg">{{ table.number }}</button>
            </form>
          {% endfor %}
        </div>
      </div>
    {% empty %}
      <p class="text-slate-500">Свободных столов нет.</p>
    {% endfor %}

    <button type="button" onclick="document.getElementById('modal').innerHTML = ''"
            class="w-full min-h-[52px] rounded-xl bg-slate-100 hover:bg-slate-200 text-[17px] font-semibold text-slate-700">Отмена</button>
  </div>
</div>
