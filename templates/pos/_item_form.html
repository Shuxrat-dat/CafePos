<div class="fixed inset-0 z-50 bg-slate-900/50 flex items-end sm:items-center justify-center p-4">
  <form class="bg-white rounded-[20px] shadow-xl w-full max-w-md p-6 space-y-5"
        hx-post="{% if item %}{% url 'edit_item' order.id item.id %}{% else %}{% url 'add_item' order.id dish.id %}{% endif %}"
        hx-target="#order-panel" hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.successful) document.getElementById('modal').innerHTML = ''">
    <div>
      <h2 class="text-[22px] font-bold tracking-tight">{{ dish.name }}</h2>
      <p class="text-slate-500 mt-0.5">{{ dish.price }} сум</p>
    </div>

    {% if dish.modifiers.all %}
      <div class="space-y-2">
        {% for m in dish.modifiers.all %}
          <label class="flex items-center justify-between gap-3 px-4 min-h-[52px] border border-slate-200 rounded-xl text-[17px] cursor-pointer hover:bg-slate-50">
            <span class="flex items-center gap-3">
              <input type="checkbox" name="modifiers" value="{{ m.id }}" class="w-5 h-5 accent-emerald-600" {% if m.id in selected %}checked{% endif %}>
              {{ m.name }}
            </span>
            <span class="text-slate-500 text-base">{% if m.price_delta %}+{{ m.price_delta }}{% else %}бесплатно{% endif %}</span>
          </label>
        {% endfor %}
      </div>
    {% endif %}

    <div>
      <label class="block text-sm text-slate-500 mb-1.5">Комментарий для повара</label>
      <input name="comment" maxlength="200" value="{{ comment }}" placeholder="Например: без зелени"
             class="w-full border border-slate-300 rounded-xl px-4 min-h-[52px] text-[17px] focus:outline-none focus:ring-2 focus:ring-emerald-400">
    </div>

    <div>
      <label class="block text-sm text-slate-500 mb-1.5">Количество</label>
      <input name="quantity" type="number" min="1" max="50" value="{{ quantity }}" inputmode="numeric"
             class="w-28 border border-slate-300 rounded-xl px-4 min-h-[52px] text-[17px] text-center focus:outline-none focus:ring-2 focus:ring-emerald-400">
    </div>

    <div class="flex gap-3 pt-1">
      <button type="button" onclick="document.getElementById('modal').innerHTML = ''"
              class="flex-1 min-h-[52px] rounded-xl bg-slate-100 hover:bg-slate-200 text-[17px] font-semibold text-slate-700">Отмена</button>
      <button class="flex-1 min-h-[52px] rounded-xl bg-emerald-500 hover:bg-emerald-400 text-emerald-950 text-[17px] font-bold">
        {% if item %}Сохранить{% else %}Добавить{% endif %}
      </button>
    </div>
  </form>
</div>
