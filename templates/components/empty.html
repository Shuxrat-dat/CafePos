{% load ui %}
<div class="flex flex-col items-center justify-center text-center py-12 px-4">
  <span class="grid place-items-center w-14 h-14 rounded-xl bg-slate-100 text-slate-400 mb-3">{% icon icon|default:"inbox" 26 %}</span>
  <p class="font-semibold text-ink">{{ title }}</p>
  {% if text %}<p class="text-sm text-muted mt-1 max-w-sm">{{ text }}</p>{% endif %}
</div>
