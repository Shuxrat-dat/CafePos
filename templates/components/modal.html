{% load i18n ui %}
{# Общая оболочка модальных окон, загружаемых через HTMX в #modal #}
<div class="fixed inset-0 z-50 bg-night/50 flex items-end sm:items-center justify-center p-3 sm:p-4" onclick="if (event.target === this) closeModal()">
  <div class="bg-white rounded-xl shadow-pop w-full {% block width %}max-w-md{% endblock %} max-h-[92vh] flex flex-col" role="dialog" aria-modal="true">
    <div class="flex items-start justify-between gap-3 px-5 pt-5 pb-3">
      <div class="min-w-0">
        <h2 class="text-xl font-bold tracking-tight">{% block modal_title %}{% endblock %}</h2>
        {% block modal_sub %}{% endblock %}
      </div>
      <button type="button" class="icon-btn border-0 -mr-2 -mt-1" onclick="closeModal()" aria-label="{% translate 'Закрыть' %}">{% icon "x" 20 %}</button>
    </div>
    <div class="px-5 pb-5 overflow-y-auto">
      {% block modal_body %}{% endblock %}
    </div>
  </div>
</div>
